name: Integration Tests

# Run on every PR and on pushes to main.
# The unit-test pipeline (pipeline.yaml) covers linting and unit tests;
# this workflow focuses on real OS behaviour and IPA connectivity.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — OS Cloud-Init Matrix
#
# One job per OS type. Each job mocks IPA and POSTs a synthetic AdmissionReview
# to the webhook, then asserts the correct OS-specific install command was
# injected into the cloud-init payload.
#
# No FreeIPA, no Kubernetes — fast (~1-2 min per job), runs in parallel.
# Pass/fail appears per-OS in the GitHub Actions UI.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  cloud-init-os-matrix:
    name: "Cloud-Init: ${{ matrix.os.name }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # Run all OS types even if one fails
      matrix:
        os:
          - name: "RHEL / CentOS"
            preference: "rhel-9"
            expected_cmd: "dnf install -y ipa-client"
            blocked_cmd: "apt-get"

          - name: "Fedora"
            preference: "fedora-41"
            expected_cmd: "dnf install -y ipa-client"
            blocked_cmd: "apt-get"

          - name: "Ubuntu"
            preference: "ubuntu-22-04"
            expected_cmd: "apt-get install -y freeipa-client"
            blocked_cmd: "dnf install"

          - name: "Debian"
            preference: "debian-12"
            expected_cmd: "apt-get install -y freeipa-client"
            blocked_cmd: "dnf install"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # python-freeipa and kubernetes-asyncio need these system libs to compile.
      - name: Install system dependencies
        run: sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt

      - name: "Test cloud-init injection — ${{ matrix.os.name }}"
        env:
          TEST_OS_PREFERENCE: ${{ matrix.os.preference }}
          TEST_EXPECTED_CMD: ${{ matrix.os.expected_cmd }}
          TEST_BLOCKED_CMD: ${{ matrix.os.blocked_cmd }}
        run: PYTHONPATH=. pytest tests/integration/test_os_matrix.py::test_os_matrix_from_env -v

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — IPA Lifecycle Integration
#
# Spins up a real FreeIPA server in a Podman container, then runs the IPA
# service layer (ipa_host_add / ipa_host_del) against it to verify the full
# host registration and cleanup lifecycle.
#
# FreeIPA takes ~3-4 minutes to initialise — this job is intentionally slow.
# It is the ground truth that the app can talk to a real IPA server.
#
# NOTE: End-to-end VM boot testing (webhook → cloud-init → OS joins IPA)
# requires KubeVirt and is planned for a future iteration.
# ─────────────────────────────────────────────────────────────────────────────
  ipa-lifecycle:
    name: "IPA Lifecycle"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # ── FreeIPA Setup ──────────────────────────────────────────────────────
      - name: Add IPA hostname to /etc/hosts
        run: echo "127.0.0.1 ipa.integration.test" | sudo tee -a /etc/hosts

      - name: Start FreeIPA container
        run: |
          docker run -d \
            --name freeipa-server \
            --hostname ipa.integration.test \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            --tmpfs /run \
            --tmpfs /tmp \
            -e PASSWORD=Secret123! \
            -p 443:443 \
            docker.io/freeipa/freeipa-server:fedora-43 \
            no-exit \
            ipa-server-install \
              --domain=integration.test \
              --realm=INTEGRATION.TEST \
              --ds-password=Secret123! \
              --admin-password=Secret123! \
              --no-ntp \
              --skip-mem-check \
              --unattended

      - name: Wait for FreeIPA to be ready
        timeout-minutes: 12
        run: |
          echo "Waiting for FreeIPA to initialize..."
          for i in $(seq 1 72); do
            # Check via HTTPS from the host — port 443 is published.
            # IPA returns 200 on /ipa/ui/ once httpd and all services are up.
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://ipa.integration.test/ipa/ui/ 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ FreeIPA ready after $((i * 10)) seconds (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i/72 — HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ FreeIPA did not become ready within 12 minutes"
          docker logs freeipa-server | tail -50
          exit 1

      # ── Python Setup ───────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run IPA lifecycle tests
        env:
          IPA_HOST: ipa.integration.test
          IPA_USER: admin
          IPA_PASS: Secret123!
          IPA_VERIFY_SSL: "false"
          DOMAIN: integration.test
          REALM: INTEGRATION.TEST
        run: PYTHONPATH=. pytest tests/integration/test_ipa_lifecycle.py -v

      # ── Diagnostics (always run on failure) ────────────────────────────────
      - name: Dump FreeIPA logs on failure
        if: failure()
        run: |
          echo "=== Container stdout (last 50 lines) ==="
          docker logs freeipa-server 2>&1 | tail -50
          echo "=== ipa-server-install log (last 80 lines) ==="
          docker exec freeipa-server cat /var/log/ipaserver-install.log 2>/dev/null | tail -80 || true
          echo "=== pkispawn log (last 50 lines) ==="
          docker exec freeipa-server find /var/log/pki -name "*.log" 2>/dev/null | head -3 | xargs -I{} sh -c 'echo "--- {} ---" && tail -30 {}' || true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Webhook → IPA Integration (Gaps 1, 2, 3)
#
# Spins up a real FreeIPA server and starts two app instances:
#   • Main app  (port 8080) — connected to real IPA, used for gaps 1 & 3
#   • Soft-fail (port 8081) — IPA_HOST points at a non-existent host, gap 2
#
# Gap 1: POST /mutate → host appears in FreeIPA with OTP set
# Gap 2: POST /mutate with unreachable IPA → allowed:True, no cloud-init
# Gap 3: Two admissions for the same VM → both succeed, one IPA entry
# ─────────────────────────────────────────────────────────────────────────────
  webhook-integration:
    name: "Webhook → IPA Integration"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # ── FreeIPA Setup ──────────────────────────────────────────────────────
      - name: Add IPA hostname to /etc/hosts
        run: echo "127.0.0.1 ipa.integration.test" | sudo tee -a /etc/hosts

      - name: Start FreeIPA container
        run: |
          docker run -d \
            --name freeipa-server \
            --hostname ipa.integration.test \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            --tmpfs /run \
            --tmpfs /tmp \
            -e PASSWORD=Secret123! \
            -p 443:443 \
            docker.io/freeipa/freeipa-server:fedora-43 \
            no-exit \
            ipa-server-install \
              --domain=integration.test \
              --realm=INTEGRATION.TEST \
              --ds-password=Secret123! \
              --admin-password=Secret123! \
              --no-ntp \
              --skip-mem-check \
              --unattended

      - name: Wait for FreeIPA to be ready
        timeout-minutes: 12
        run: |
          echo "Waiting for FreeIPA to initialize..."
          for i in $(seq 1 72); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://ipa.integration.test/ipa/ui/ 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ FreeIPA ready after $((i * 10)) seconds"
              exit 0
            fi
            echo "⏳ Attempt $i/72 — HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ FreeIPA did not become ready within 12 minutes"
          docker logs freeipa-server | tail -50
          exit 1

      # ── Python + App Setup ─────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt

      # A minimal kubeconfig keeps the controller task alive in its retry loop
      # so /healthz returns 200 without a real Kubernetes cluster.
      - name: Create fake kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'KUBEEOF'
          apiVersion: v1
          clusters:
          - cluster:
              server: https://localhost:6443
            name: fake
          contexts:
          - context:
              cluster: fake
              user: fake
            name: fake
          current-context: fake
          kind: Config
          preferences: {}
          users:
          - name: fake
            user:
              token: fake-token
          KUBEEOF

      - name: Start main app (valid IPA — gaps 1 & 3)
        run: |
          IPA_HOST=ipa.integration.test \
          IPA_USER=admin \
          IPA_PASS=Secret123! \
          IPA_VERIFY_SSL=false \
          DOMAIN=integration.test \
          REALM=INTEGRATION.TEST \
          PYTHONPATH=. \
          uvicorn app.main:app --host 0.0.0.0 --port 8080 \
            > /tmp/uvicorn-main.log 2>&1 &

      - name: Start soft-fail app (unreachable IPA — gap 2)
        run: |
          IPA_HOST=nonexistent.invalid \
          IPA_USER=admin \
          IPA_PASS=fake \
          DOMAIN=integration.test \
          PYTHONPATH=. \
          uvicorn app.main:app --host 0.0.0.0 --port 8081 \
            > /tmp/uvicorn-softfail.log 2>&1 &

      - name: Wait for both app instances to be ready
        run: |
          for port in 8080 8081; do
            echo "Waiting for app on port $port..."
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:${port}/metrics" > /dev/null 2>&1; then
                echo "✅ App on :${port} ready after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ App on :${port} did not start within 30s"
                cat /tmp/uvicorn-main.log || true
                cat /tmp/uvicorn-softfail.log || true
                exit 1
              fi
              sleep 1
            done
          done

      # Let the controller's first K8s connection attempt fail and settle into
      # its retry sleep so the main app's /healthz returns 200.
      - name: Allow controller retry loop to stabilise
        run: sleep 6

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run webhook → IPA integration tests
        env:
          APP_BASE_URL: http://localhost:8080
          SOFT_FAIL_APP_URL: http://localhost:8081
          IPA_HOST: ipa.integration.test
          IPA_USER: admin
          IPA_PASS: Secret123!
          IPA_VERIFY_SSL: "false"
          DOMAIN: integration.test
          REALM: INTEGRATION.TEST
        run: PYTHONPATH=. pytest tests/integration/test_webhook_ipa.py -v

      # ── Diagnostics ────────────────────────────────────────────────────────
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Main app log ==="
          cat /tmp/uvicorn-main.log || true
          echo "=== Soft-fail app log ==="
          cat /tmp/uvicorn-softfail.log || true
          echo "=== FreeIPA container log (last 50 lines) ==="
          docker logs freeipa-server 2>&1 | tail -50 || true
          echo "=== ipa-server-install log ==="
          docker exec freeipa-server cat /var/log/ipaserver-install.log 2>/dev/null | tail -50 || true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Observability (Health Probes + Prometheus Scraping)
#
# Starts the app via uvicorn and a Prometheus container, then verifies:
#   • /healthz and /readyz return the correct status codes and bodies
#   • /metrics returns valid Prometheus text exposition format
#   • Prometheus can scrape /metrics and stores the expected time-series
#
# No FreeIPA or Kubernetes cluster is required — a fake kubeconfig keeps the
# controller task alive in its retry loop so the liveness probe is happy.
# ─────────────────────────────────────────────────────────────────────────────
  observability:
    name: "Observability (Health + Prometheus)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt

      # ── App Setup ──────────────────────────────────────────────────────────
      # A minimal kubeconfig pointing at a non-existent cluster lets
      # kubernetes_asyncio load config successfully. The controller then enters
      # its retry loop (connection refused to localhost:6443) and the asyncio
      # task stays alive, so /healthz returns 200.
      - name: Create fake kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'KUBEEOF'
          apiVersion: v1
          clusters:
          - cluster:
              server: https://localhost:6443
            name: fake
          contexts:
          - context:
              cluster: fake
              user: fake
            name: fake
          current-context: fake
          kind: Config
          preferences: {}
          users:
          - name: fake
            user:
              token: fake-token
          KUBEEOF

      - name: Start app
        run: |
          DOMAIN=test.local \
          IPA_HOST=localhost \
          IPA_USER=admin \
          IPA_PASS=fake \
          PYTHONPATH=. \
          uvicorn app.main:app --host 0.0.0.0 --port 8080 \
            > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for app to start
        run: |
          echo "Waiting for app to accept connections..."
          for i in $(seq 1 30); do
            # /metrics is always available regardless of controller state
            if curl -sf http://localhost:8080/metrics > /dev/null 2>&1; then
              echo "✅ App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ App did not start within 30 seconds"
          cat /tmp/uvicorn.log
          exit 1

      # Allow the controller's first K8s connection attempt to fail and settle
      # into its retry sleep so the liveness probe returns 200.
      - name: Allow controller retry loop to stabilise
        run: sleep 6

      # ── Prometheus Setup ───────────────────────────────────────────────────
      - name: Write Prometheus scrape config
        run: |
          cat > /tmp/prometheus.yml <<'PROMEOF'
          global:
            scrape_interval: 5s
            evaluation_interval: 5s

          scrape_configs:
            - job_name: 'virt-ipa-joiner'
              static_configs:
                - targets: ['localhost:8080']
          PROMEOF

      # --network=host lets the Prometheus container reach localhost:8080 on
      # the runner without needing bridge networking or extra host entries.
      - name: Start Prometheus
        run: |
          docker run -d \
            --name prometheus \
            --network=host \
            -v /tmp/prometheus.yml:/etc/prometheus/prometheus.yml \
            prom/prometheus:latest \
            --config.file=/etc/prometheus/prometheus.yml \
            --web.listen-address=:9090

      - name: Wait for Prometheus to be ready
        run: |
          echo "Waiting for Prometheus..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/-/ready > /dev/null 2>&1; then
              echo "✅ Prometheus ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Prometheus did not become ready within 30 seconds"
          docker logs prometheus | tail -20
          exit 1

      # ── Generate traffic so metrics have samples ───────────────────────────
      - name: Warm up metrics
        run: |
          for endpoint in /healthz /readyz /metrics; do
            curl -sf "http://localhost:8080${endpoint}" > /dev/null || true
          done

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run observability integration tests
        env:
          APP_BASE_URL: http://localhost:8080
          PROMETHEUS_URL: http://localhost:9090
        run: PYTHONPATH=. pytest tests/integration/test_observability.py -v

      # ── Diagnostics ────────────────────────────────────────────────────────
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== App (uvicorn) log ==="
          cat /tmp/uvicorn.log || true
          echo "=== Prometheus log ==="
          docker logs prometheus 2>&1 | tail -30 || true
          echo "=== Prometheus targets ==="
          curl -s http://localhost:9090/api/v1/targets | python3 -m json.tool || true
